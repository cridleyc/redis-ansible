# create a clustered replicated database with 10 shards
# backed up via snapshot every 6 hours
# note: you need to update the cluster license first
# the shell script redis-update-license.sh will apply a 
# poc license - the license file is set in the source.sh file
  - name: clustered-replicated-snapshot-backup
    memory_size: 204800
    port: 12002
    sharding: true
    shards_count: 10
    shard_key_regex: [{
         "regex" : ".*\\{(?<tag>.*)\\}.*"
      },
      {
         "regex" : "(?<tag>.*)"
      }]
    replication: true
    data_persistence: snapshot
    snapshot_policy : [{"secs" : 21600, "writes" : 1}]
    shards_placement: sparse

  # create a source db with password to be use by a replica_of db
  - name: sourcedb
    port: 12003
    memory_size: 204800
    sharding: false
...
