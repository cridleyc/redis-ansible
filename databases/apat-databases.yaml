# set of databases use for testing APAT - if needed these can be
# broken out into separate yaml files - memory limits are very small
# by default.  It is necessary to apply non-demo license to accommodate
# the number of shards - the script redis-update-license.sh will 
# apply the license defined in the source.sh script
